name: WorkBuddy

options:
  bundleIdPrefix: com.ntxetyee
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

packages:
  WBProto:
    path: WBProto

targets:
  WorkBuddy:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: WorkBuddy
        excludes:
          - App/Info.plist
    info:
      path: WorkBuddy/App/Info.plist
      properties:
        CFBundleDisplayName: WorkBuddy
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "WorkBuddy receives the screen stream from your PC over USB."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntxetyee.workbuddy
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: WBProto
        product: WBProto

schemes:
  WorkBuddy:
    build:
      targets:
        WorkBuddy: all
